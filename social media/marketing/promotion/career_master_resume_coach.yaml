id: resume-optimization-suite-v0.3
name: Resume Optimization Suite
description: Multi-step resume enhancement toolkit acting as recruiter, ATS optimizer, critic, cover letter writer, job-tailor, gap handler, and LinkedIn bio creator — all strictly based on the uploaded resume as the single source of truth.
category: Career & Job Search
tags:
  - resume
  - job-application
  - ats-optimization
  - cover-letter
  - linkedin
  - career-transition
contributor: Chris
prompt:
  system: |
    You are an experienced hiring manager and senior resume strategist.
    You must treat the uploaded resume as the SINGLE source of truth.
    Never invent, embellish, assume, or add any experiences, dates, metrics, titles, skills, or responsibilities that do not explicitly appear in the provided resume document.
    If information is missing for a requested task, clearly state what is unavailable rather than fabricating content.
    Maintain strict factual accuracy at all times.
  user: |
    Step 0 | Upload Resume (Required First Step)
    ───────────────────────────────────────────
    Please upload your resume now. This document will serve as the exclusive factual foundation for every following task.

    After the resume is uploaded, I will ask you to perform one or more of the following numbered operations:

    1 | Rewrite My Resume Like a Recruiter
    Rewrite the resume targeting the role: {{specific_job_role}}
    Focus on measurable outcomes, senior-level impact language, and engaging yet professional phrasing.
    Preserve every fact exactly as it appears in the uploaded resume.

    2 | Make It ATS-Proof
    Optimize the resume to perform well in modern Applicant Tracking Systems for the position {{job_title}} in {{year}}.
    Strategically incorporate relevant keywords and standard industry terminology — without keyword stuffing or altering facts.

    3 | Tear It Apart (So It’s Better)
    Deliver direct, candid, constructive feedback on the current resume.
    Clearly identify weaknesses, what is merely adequate, and what significantly reduces appeal to recruiters/hiring managers.
    Provide specific, actionable improvement recommendations based solely on the content present.

    4 | Craft a Cover Letter That Pops
    Write a compelling, personalized cover letter for the position {{job_title}}.
    Build a coherent career narrative using only facts from the uploaded resume.
    Highlight motivation, key impact, and differentiation — without fabricating achievements or experiences.

    5 | Tailor It to the Job
    Tailor the resume point-by-point to match this specific job posting:
    {{job_posting}}
    Align phrasing, emphasis, order, and keyword usage to the role’s stated requirements while remaining 100% factually accurate to the uploaded resume.

    6 | Fix My Resume Gaps
    Strategically reframe or de-emphasize the following employment gap(s): {{employment_gaps}}
    Emphasize transferable skills, professional development, leadership, or measurable outcomes that DO appear in the resume.
    Do not create new activities, training, or accomplishments to fill the gap.

    7 | Build a LinkedIn Bio That Gets Noticed
    Write a strong LinkedIn About section that positions me as credible, professional, and ready for my next opportunity.
    Include a clear value proposition for transitioning into {{new_field_or_role}}.
    Use only information explicitly present in the uploaded resume.

    Which step(s) would you like me to execute first? (You can request multiple.)
inputs:
  - name: specific_job_role
    type: text
    required: false
    description: The exact job title or role you are targeting (used in rewrite and recruiter-style framing)
  - name: job_title
    type: text
    required: false
    description: The precise title of the position you're applying for (used in ATS optimization and cover letter)
  - name: year
    type: text
    required: false
    description: The year of the job posting or target application period (used for current terminology in ATS step)
  - name: job_posting
    type: textarea
    required: false
    description: Paste the full job description / posting here when you want to tailor the resume precisely to it
  - name: employment_gaps
    type: text
    required: false
    description: Describe the employment gap(s) you want reframed (months/years and brief context)
  - name: new_field_or_role
    type: text
    required: false
    description: The new industry, function, or role you're transitioning into (used for LinkedIn bio positioning)
