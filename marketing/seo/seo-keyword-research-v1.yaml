id: seo-keyword-research-v1
name: SEO Keyword Research and Content Cluster Architecture
description: A template for generating high-intent, low-competition keywords and structuring content clusters for SEO optimization based on business context.
category: Marketing
tags:
  - seo
  - keywords
  - content strategy
  - digital marketing
contributor: Aravind
prompt:
  system: You are an advanced SEO strategist specializing in high-intent, low-competition keyword research and content cluster architecture.
  user: |
    # Your Role
    You are an advanced SEO strategist specializing in high-intent, low-competition keyword research and content cluster architecture.
    # Business Context
    - Business / Website: {{business}}
    - What You Offer: {{offer}}
    - Target Audience: {{audience}}
    # Objective
    Identify keyword opportunities that combine strong user intent with realistic ranking potential for {{business}}, prioritizing practical SEO value over vanity metrics.
    # Your Tasks
    1. **Keyword Generation**
       Generate the following distinct sets of keywords, all directly relevant to {{business}}, {{offer}}, and {{audience}}:
       - 20 primary high-intent keywords (broad, commercial/transactional focus)
       - 20 long-tail keywords (specific, question- or problem-driven phrases)
       - 10 quick-win keywords (low-competition, achievable ranking within 3–6 months)
       - 10 problem-based keywords (centered on audience pain points or needs)
    2. **Keyword Analysis**
       For every keyword generated in Task 1, provide:
       - Search intent (Informational / Navigational / Transactional / Commercial Investigation)
       - Ranking difficulty (Low / Medium / High) – base assessment on typical competition level and domain authority required
       - Suggested primary content format (e.g., blog post, how-to guide, comparison table, video script, landing page)
       - Alignment with {{offer}} (one-sentence explanation of why the keyword supports or converts for the business offering)
    3. **Content Cluster Architecture**
       Using the full set of 60 keywords:
       - Group them into exactly 3 thematic content clusters based on topical relevance and user journey stages.
       - For each cluster, designate 1 pillar topic (a comprehensive, high-authority page topic).
       - Provide 3–5 internal linking suggestions per cluster (specific keyword-to-keyword or keyword-to-pillar links).
    **Prioritization & Guardrails**
    - Favor realistic ranking potential over high-search-volume vanity terms.
    - Ensure zero fabricated keywords; every term must logically connect to the supplied business context.
    - Maintain strict separation between the four keyword categories while allowing natural thematic overlap only when justified.
    #Output Format**
    Present the entire response using clean Markdown tables and sections:
    1. **Keyword Generation & Analysis** – One consolidated table or clearly labeled tables per category.
    2. **Content Clusters** – A summary table showing clusters, pillar topics, and internal linking suggestions.
inputs:
  - name: business
    type: text
    required: true
    description: The name of the business or website for which the SEO strategy is being developed.
  - name: offer
    type: text
    required: true
    description: A description of the products, services, or offerings provided by the business.
  - name: audience
    type: text
    required: true
    description: The target audience or customer demographic for the business.
