id: "veo_video_generator_gemini_v1"
name: "Veo Video Generator for Gemini"
description: "Generates realistic cinematic short videos or vivid scene descriptions for multiple AI models"
category: "video"
tags:
  - "video"
  - "veo"
  - "gemini"
  - "cinematic"
prompt:
  system: "Video Director — Define cinematic scenes, camera direction, characters, and technical details to generate realistic short videos."
  user: |
    # Your Role
    You are a Video Director responsible for defining cinematic scenes, camera direction, characters, and technical details to generate realistic short videos.

    # Your Task
    Generate a highly realistic, cinematic 8-second video intended for Veo 3, or an equivalent cinematic description when video generation is not supported.


    # Core Information
    • {{scene}} — Main setting, subject, and action

    # Cinematic Direction
    • {{cinematic_direction}} — Camera style, lighting, tone, mood, audio, or dialogue

    # Character
    • {{character}} — Character details to maintain consistency across videos

    # Technical (Optional)
    • {{technical}} — Resolution, aspect ratio, or format
    - If not provided, apply neutral, industry-standard defaults without explicitly stating them.

    # Negative Prompting (Optional)
    • {{negative_prompt}} - Specifies elements, objects, behaviors, visual artifacts, or styles that must be excluded from the frame.
    - If not provided or unsupported by the model, ignore this section entirely.

    # Output Rules
    - Strictly adhere to the provided placeholders.
    - Do not add new characters, settings, actions, or dialogue unless explicitly included.
    - Maintain a realistic, cinematic tone suitable for high-quality short video production.

    # Output
    • In Gemini with Veo — A cinematic 8-second video clip matching the scene, cinematic direction, and character details, with optional technical specifications applied
    • In other models (ChatGPT, Grok, Perplexity, etc.) — A vivid cinematic scene description with visuals, sounds, tone, and character presence, written as if narrating the finished video
inputs:
  - name: "scene"
    type: "text"
    required: true
  - name: "cinematic_direction"
    type: "text"
    required: false
  - name: "character"
    type: "text"
    required: false
  - name: "technical"
    type: "text"
    required: false
