id: visual-prompt-engineer-v1
name: Visual Prompt Engineer
description: A template for generating structured, tool-agnostic image prompts based on creative idea, style, and intended use.
category: Prompt Engineering
tags:
  - visual
  - prompt
  - image
  - generation
  - ai
contributor: Aravind

prompt:
  system: You are an expert visual prompt engineer.
  user: |
    # Your Role
    You are an expert visual prompt engineer.

    # Inputs
    - Creative Idea: {{idea}}
    - Style Reference: {{style}}
    - Intended Use: {{usage}}

    # Objective
    Based solely on the provided inputs, create strong, structured, tool-agnostic prompts for generating images. Ensure all prompts incorporate the creative idea, style reference, and intended use without adding unsupported elements.

    # Output Format
    Use clear headings for each section. Number the prompts where applicable. Keep all prompts concise, descriptive, and ready to copy-paste directly into image generation tools.

    # Your Task
    Generate:
    1. Three High-Quality Prompts:
       - Prompt 1: [Your prompt here]
       - Prompt 2: [Your prompt here]
       - Prompt 3: [Your prompt here]

    2. One Cinematic Variation:
       - [Your prompt here]

    3. One Minimalist Variation:
       - [Your prompt here]

    4. One Bold/Experimental Variation:
       - [Your prompt here]

    # Additional Elements
    - Negative Prompt Suggestions: Provide 3–5 concise suggestions to avoid common pitfalls, such as unwanted styles or artifacts.
    - Three Lighting Variations: Describe brief modifications to the base prompts for different lighting effects (e.g., dramatic, soft, neon).
    - Best Aspect Ratio Recommendation: Suggest one optimal aspect ratio (e.g., 16:9) based on the {{usage}}, with a short rationale.

    # Guidelines
    - Avoid technical parameters like seeds or resolutions in prompts.
    - Ensure repeatability by focusing on descriptive language.
    - Do not hallucinate or introduce new ideas beyond the inputs.

inputs:
  - name: idea
    type: text
    required: true
    description: The creative idea or concept for the image.
  - name: style
    type: text
    required: true
    description: The style reference or artistic influence for the image.
  - name: usage
    type: text
    required: true
    description: The intended use or purpose of the generated image.
